<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f0"><meta name="description" content="毎日の食事をカレンダーに。月ごとの食費を、ひと目で。">
  <meta name="referrer" content="no-referrer"><title>食事カレンダー</title><link rel="stylesheet" href="./style.css?v=2"><script type="module" src="./app.js?v=2"></script>
</head>
<body>
  <main>
    <header class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v6m3-6v6M2 3v6a3 3 0 0 0 6 0M5 12v9M16 3v18m0-18c-4 3-4 10 0 10h2V3z"/></svg></span><h1>食事カレンダー</h1><div class="sharing-controls"><button id="deviceButton" class="device-button">端末の名前</button><button id="shareButton" class="share-button" disabled>共有</button></div></header>
    <section class="overview" aria-label="月の食費">
      <div><p class="eyebrow" id="summaryLabel">今月の食費</p><p class="total" id="monthTotal" aria-live="polite">¥0</p><p class="summary-caption">毎日のごはんを、ひと月の記録に。</p></div>
      <div class="plate-art" aria-hidden="true"><div class="plate"><div class="leaf leaf-one"></div><div class="leaf leaf-two"></div><div class="seed"></div></div><div class="fork"></div><div class="knife"></div></div>
    </section>
    <div class="person-totals" id="personTotals" aria-label="名前ごとの食費"></div>
    <section class="calendar-section" aria-label="食事カレンダー">
      <div class="calendar-toolbar"><div class="month-controls"><button class="arrow" id="prevMonth" aria-label="前の月">‹</button><label class="month-label"><span id="monthTitle"></span><input type="month" id="monthPicker" aria-label="表示する月" min="1900-01" max="9999-12"></label><button class="arrow" id="nextMonth" aria-label="次の月">›</button></div><button class="today-button" id="today">今日</button></div>
      <div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendar" class="calendar"></div>
      <p class="hint"><span aria-hidden="true">＋</span> 日付をタップして、食事を記録</p>
    </section>
    <div class="sync-footer"><button id="syncStatus" class="sync-status" aria-live="polite">共有を設定</button><button id="importLegacy" class="import-button" hidden></button></div>
    <p class="storage-note" id="storageNote">共有リンクから、2人で同じ記録を使えます。</p>
    <p class="error" id="storageError" role="alert" hidden></p>
  </main>
  <dialog id="dayDialog" aria-labelledby="dayTitle">
    <div class="dialog-head"><div><p class="eyebrow" id="dayWeekday"></p><h2 id="dayTitle"></h2></div><button class="close" id="closeDialog" aria-label="閉じる">×</button></div>
    <div class="day-summary"><span>この日の食費</span><strong id="dayTotal">¥0</strong></div>
    <div id="entries" class="entries"></div>
    <form id="mealForm">
      <h3 id="formTitle">食事を追加</h3><p class="auto-name" id="autoName"></p><fieldset id="mealTypes"><legend class="sr-only">食事の種類</legend></fieldset>
      <label class="field">食事名<input id="mealName" name="mealName" maxlength="80" required placeholder="例：焼き魚定食" autocomplete="off"></label>
      <label class="field">金額<div class="amount-input"><span>¥</span><input id="mealAmount" name="mealAmount" type="number" inputmode="numeric" min="0" max="99999999" step="1" required placeholder="0"></div></label>
      <p id="formError" class="error" role="alert" hidden></p>
      <div class="form-actions"><button type="button" id="cancelEdit" class="cancel" hidden>編集をやめる</button><button type="submit" class="save" id="saveMeal">記録する<span aria-hidden="true"> ↗</span></button></div>
    </form>
  </dialog>
  <dialog id="setupDialog" aria-labelledby="setupTitle">
    <div class="dialog-head"><h2 id="setupTitle">この端末の名前</h2><button class="close" id="closeSetup" aria-label="設定を閉じる">×</button></div>
    <p class="setup-copy" id="setupCopy">この端末からの食事記録に、自動で付ける名前です。</p>
    <div id="savedNames" class="saved-names"></div>
    <form id="setupForm"><label class="field" id="deviceNameLabel">名前<input id="deviceName" maxlength="30" required placeholder="例：楓のiPhone" autocomplete="nickname"></label><button class="save full" id="setupSubmit" type="submit">共有カレンダーを作成</button></form>
    <form id="joinForm" class="join-form"><p class="join-divider">すでに共有リンクがある場合</p><label class="field">共有リンク・コード<input id="joinLink" required autocomplete="off" placeholder="相手から届いたリンクを貼り付け"></label><button class="cancel full" type="submit">共有カレンダーを開く</button></form>
    <p id="setupError" class="error" role="alert" hidden></p>
  </dialog>
  <dialog id="shareDialog" aria-labelledby="shareTitle">
    <div class="dialog-head"><h2 id="shareTitle">もう1人に共有</h2><button class="close" id="closeShare" aria-label="共有を閉じる">×</button></div>
    <p class="setup-copy">このリンクを相手に送ってください。リンクを知っている人は、同じ記録を見たり編集したりできます。</p>
    <label class="field">共有リンク<input id="sharedLink" readonly autocomplete="off"></label>
    <button id="copyLink" class="save full">リンクをコピー</button><p id="copyStatus" class="setup-copy" role="status"></p>
  </dialog>
</body>
</html>
