<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f0"><meta name="referrer" content="no-referrer"><meta name="description" content="買った日と金額を記録。2人の食費をシンプルに。"><title>食費カレンダー</title><link rel="stylesheet" href="./style.css?v=4"><script type="module" src="./app.js?v=4"></script></head>
<body>
<main>
 <header class="brand"><span class="brand-icon" aria-hidden="true">¥</span><h1>食費カレンダー</h1><div class="sharing-controls"><button id="deviceButton" class="device-button">名前を入力</button><button id="shareButton" class="share-button" disabled>共有</button></div></header>
 <section class="overview" aria-label="月の食費"><div><p class="eyebrow" id="summaryLabel">今月の食費</p><p class="total" id="monthTotal" aria-live="polite">¥0</p><p class="summary-caption">買った日と金額だけ、シンプルに。</p></div><div class="plate-art" aria-hidden="true"><div class="plate"><div class="leaf leaf-one"></div><div class="leaf leaf-two"></div><div class="seed"></div></div><div class="fork"></div><div class="knife"></div></div></section>
 <div class="person-totals" id="personTotals" aria-label="名前ごとの食費"></div>
 <section class="calendar-section" aria-label="食費カレンダー"><div class="calendar-toolbar"><div class="month-controls"><button class="arrow" id="prevMonth" aria-label="前の月">‹</button><label class="month-label"><span id="monthTitle"></span><input type="month" id="monthPicker" aria-label="表示する月" min="1900-01" max="9999-12"></label><button class="arrow" id="nextMonth" aria-label="次の月">›</button></div><button class="today-button" id="today">今日</button></div><div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div><p class="hint">＋ 日付をタップして記録</p></section>
 <div class="sync-footer"><button id="syncStatus" class="sync-status" aria-live="polite">読み込み中…</button><button id="importLegacy" class="import-button" hidden></button></div><p class="storage-note" id="storageNote">記録は2人で共有されます。</p><p class="error" id="storageError" role="alert" hidden></p>
</main>
<dialog id="dayDialog" aria-labelledby="dayTitle"><div class="dialog-head"><div><p class="eyebrow" id="dayWeekday"></p><h2 id="dayTitle"></h2></div><button class="close" id="closeDialog" aria-label="閉じる">×</button></div><div class="day-summary"><span>この日の食費</span><strong id="dayTotal">¥0</strong></div><div id="entries" class="entries"></div><form id="purchaseForm"><h3 id="formTitle">記録を追加</h3><p class="auto-name" id="autoName"></p><label class="field">買った日<input id="purchaseDate" type="date" required min="1900-01-01" max="9999-12-31"></label><label class="field">金額<div class="amount-input"><span>¥</span><input id="purchaseAmount" type="number" inputmode="numeric" min="0" max="99999999" step="1" required placeholder="0"></div></label><p id="formError" class="error" role="alert" hidden></p><div class="form-actions"><button type="button" id="cancelEdit" class="cancel" hidden>編集をやめる</button><button type="submit" class="save" id="savePurchase">追加する</button></div></form></dialog>
<dialog id="nameDialog" aria-labelledby="nameTitle"><div class="dialog-head"><h2 id="nameTitle">名前を入力</h2><button class="close" id="closeName" aria-label="名前設定を閉じる" hidden>×</button></div><p class="setup-copy">登録済みの名前なら、その人として入れます。次回からは自動です。</p><form id="nameForm"><label class="field">名前<input id="deviceName" maxlength="30" required placeholder="あなたの名前" autocomplete="nickname"></label><p id="registeredNames" class="registered-names"></p><button class="save full" id="registerName" type="submit">この名前で入る</button></form><p id="nameError" class="error" role="alert" hidden></p></dialog>
<dialog id="shareDialog" aria-labelledby="shareTitle"><div class="dialog-head"><h2 id="shareTitle">もう1人に共有</h2><button class="close" id="closeShare" aria-label="共有を閉じる">×</button></div><p class="setup-copy">このリンクを相手に送ってください。相手も自分の名前で入れます。別端末でも同じ名前で続きから使えます。</p><label class="field">共有リンク<input id="sharedLink" readonly autocomplete="off"></label><button id="copyLink" class="save full">リンクをコピー</button><p id="copyStatus" class="setup-copy" role="status"></p><p class="storage-note">リンクは一緒に使う相手だけに送ってください。</p></dialog>
</body></html>
